[project]
name = "jobhunt"
version = "0.1.0"
description = "Local job-search app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "pypdf",
    "google-genai",
    "python-multipart",
    "google-auth-oauthlib>=1.5.0",
    "reportlab>=5.1.0",
    "anthropic>=2.5.0",
]

[project.scripts]
jobhunt = "jobhunt.cli:main_entry"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
