{% extends "base.html" %}{% block body %}
<h1 class="text-2xl font-bold">Companies</h1>
<div class="flex gap-2">
<form method="post" action="/scan"><button class="btn btn-primary">Scan now</button></form>
<form method="post" action="/import"><button class="btn">Import</button></form>
</div>
<div class="overflow-x-auto"><table class="table table-zebra"><thead><tr><th>Company</th><th>ATS</th><th>Open jobs</th><th>Last scanned</th><th>Last error</th></tr></thead><tbody>
{% for c, n in rows %}<tr><td>{{ c.name }}</td><td>{{ c.ats or '' }}</td><td>{{ n }}</td>
<td>{{ c.last_scanned or '' }}</td><td>{% if c.last_error %}<span class="text-error">{{ c.last_error }}</span>{% endif %}</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
