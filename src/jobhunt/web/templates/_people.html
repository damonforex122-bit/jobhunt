<div id="people">
<h2>People at {{ job.company }}</h2>
{% if people_error %}<p class="err">{{ people_error }}</p>{% endif %}
{% if people %}<table><tr><th>Name</th><th>Title</th><th>Source</th><th>Link</th></tr>
{% for p in people %}<tr><td>{{ p.name }}</td><td>{{ p.title or '' }}</td>
<td><span class="badge">{{ p.source }}</span></td>
<td><a href="{{ p.source_url }}" rel="noopener noreferrer">source</a>{% if p.linkedin_url %} <a href="{{ p.linkedin_url }}" rel="noopener noreferrer">LinkedIn</a>{% endif %}</td></tr>{% endfor %}</table>
{% else %}<p>No people found yet.</p>{% endif %}
<button hx-post="/jobs/{{ job.id }}/people" hx-target="#people" hx-swap="outerHTML">Find people</button>
</div>
