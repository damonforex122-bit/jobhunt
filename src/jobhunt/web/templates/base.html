<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>jobhunt</title>
<meta name="color-scheme" content="light only">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.50/daisyui.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.3"></script>
<style>
:root{color-scheme:light only}
.posting{white-space:pre-wrap}
</style></head><body class="bg-base-100 text-base-content">
<div class="navbar bg-base-200 shadow-sm">
  <div class="flex-1"><a class="btn btn-ghost text-xl" href="/">jobhunt</a></div>
  <ul class="menu menu-horizontal px-1">
    <li><a href="/">Jobs</a></li>
    <li><a href="/pipeline">Pipeline</a></li>
    <li><a href="/interviews">Interviews</a></li>
    <li><a href="/companies">Companies</a></li>
    <li><a href="/profile">Profile</a></li>
  </ul>
</div>
{% block wide %}
<main class="max-w-6xl mx-auto p-4 space-y-3">
{% for b in banner %}<div role="alert" class="alert alert-warning">{{ b }}</div>{% endfor %}
{% if msg %}<div role="alert" class="alert alert-success">{{ msg }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
{% endblock %}
</body></html>
