<div id="review-header" class="flex items-center gap-3">
<h1 class="text-xl font-bold">{{ job.company }} &mdash; {{ job.title }}</h1>
{% if final %}<span class="badge badge-success">Final ✓</span>
{% elif has_pdf %}<button class="btn btn-sm btn-outline" hx-post="/jobs/{{ job.id }}/review/final" hx-target="#review-header" hx-swap="outerHTML">Mark final</button>{% endif %}
<a class="link ml-auto text-sm" href="/jobs/{{ job.id }}">Back to job</a>
</div>
